# Supplementary fold (run eu27_v2_evfta1y) - ONE-YEAR METRICS ONLY.
#
# No leaderboard fold can train on post-EVFTA origins: the training block is
# censored at its own end, so a model that saw origin 2021 could only be tested
# on 2024 origins, which have one year of follow-up. This fold accepts that
# trade to answer the one question the leaderboard cannot: does the EVFTA
# staging variable (evfta_cut_cum_pp_lag, non-zero from origin 2021) add
# one-year predictive information once a model has seen it vary?
#
# Effective origins: train 2012-2021 (outcomes read to 2022), valid 2023
# (read to 2024), test 2024 (read to 2025). Score with Brier/AUC/ECE at 1 year
# and Antolini C; IBS 1-3 is NaN by construction.

folds:
  - id: 4
    train: [2012, 2022]
    valid: [2023, 2024]
    test:  [2024, 2024]
