  - gravity_source_year
  - importer_lpi_source_year
  - ntm_ave_source_year
  - ntm_survey_year
  - fta_names
  - tariff_type
  - tariff_reporter
  - us_recip_effective_from
  # the sector-level NTM family: never mixed with the HS6 family (data handoff)
  - ntm_coverage_ratio
  - ntm_frequency_ratio
  - ntm_sector_freq_any
  - ntm_sector_share_3plus
  - ntm_sps_coverage
  - ntm_tbt_coverage
  # the 2025 US tariff block: a scenario input, never a training feature
  - us_recip_rate_yearend
  - us_recip_rate_peak
  - us_recip_rate_days_wt
  - us_recip_floor
  - us_transship_rate
