# Feature registry - the frozen contract between the panel and every model.
#
# This file is not documentation. benchmark/features/build_matrix.py reads it and
# builds the design matrix from it, so a feature that is not written down here
# does not reach any model, and a feature written down here reaches EVERY model
# in the cell. That is the mechanism behind plan section 7.1: the leaderboard
# compares algorithms under one information set, never one algorithm with a
# richer information set.
#
# Field meanings
#   set          F0..F5, the incremental ablation block (plan section 8)
#   concept      the economic quantity, not the column name
#   lit          which seed paper motivates it
#   source       panel column, or `derived` when build_matrix.py constructs it
#   timing       when the value is known relative to the prediction origin t
#   transform    applied by build_matrix.py
#   missing      imputation rule; `median+flag` adds a companion _isna column
#   direction    expected sign on the HAZARD (up = raises failure risk)
#   leakage      residual risk after the timing rule
#
# Timing vocabulary
#   at_t         dated t, inside F_t. Legitimate: the panel's event dated t means
#                death in t+1, so a value dated t precedes the failure.
#   lag1         dated t-1
#   spell_start  fixed at the first year of the spell
#   static       time-invariant dyad/product attribute

meta:
  frozen: 2026-09-10
  panel: data/final/stage1_panel.parquet
  note_on_current_year_value: >
    log_value (the origin year's trade value) is admitted deliberately. Plan
    section 9 excludes a current-year value only when the target makes it
    simultaneous with failure. Here it is not: the panel dates the event in the
    LAST year the relationship is alive, so the origin-year value is the last
    observation before the failure, not a reading taken after it. Dropping it
    would also blind every model on age-1 rows, where no lag exists and where
    half of all events occur.

