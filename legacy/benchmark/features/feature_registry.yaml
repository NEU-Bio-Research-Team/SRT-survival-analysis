# Theory-motivated interactions. NOT part of the shared matrix: they exist only
# for the theory-enhanced cloglog of plan section 16.1, so that the classical
# baseline is not a straw man. ML models are never handed them - the point of the
# contrast is whether the algorithm finds them by itself.
interactions_F3x:
  - [exp_dest, n_products_to_c_lag]
  - [exp_prod, n_markets_for_p_lag]
  - [exp_prod, proximity_hs2_lag]

# Columns that may never enter any predictor set (plan section 9).
banned:
  - spell_id
  - year
  - t_start
  - t_stop_as_endpoint
  - spell_start_year
  - spell_end_year
  - right_censored
  - event
  - gap_filled
  - tariff_source_year
