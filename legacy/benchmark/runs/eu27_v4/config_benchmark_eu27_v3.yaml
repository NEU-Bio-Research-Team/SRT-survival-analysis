# Frozen benchmark configuration - EU27/B0-locked scope, third revision (eu27_v3).
#
# Supersedes benchmark_eu27_v2.yaml, which stays frozen as scored. What changed:
#   * panel    - the v2 Stage 1 panel (docs/STAGE1_PANEL_FIX_PLAN.md): orphan HS
#                deaths removed, deaths counted only when confirmed by observed
#                HS6 years, EU tariff from the EU schedule, lag fixes.
#   * target   - gap_tolerance: 1. The panel reads a relationship absent for one
#                year and back as one spell, so a death in D is known only once
#                D+1 and D+2 are seen. rolling_origin.censor_block_gap applies
#                that inside every block (events need D <= horizon - 2) and
#                censors at the last year actually alive.
#   * matrix   - data/interim/benchmark_matrix_eu27_v4.parquet
#                (registry feature_registry_eu27_v4.yaml).
#   * splits   - splits_eu27_v3.yaml. With events confirmable through 2023 only,
#                IBS 1-3 is observable for test origins up to 2021, and a
#                validation block needs three years to hold any event.
#
# Build the matrix with:
#   python benchmark/features/build_matrix.py --eu27-only \
#     --config benchmark/config/benchmark_eu27_v3.yaml \
#     --registry benchmark/features/feature_registry_eu27_v4.yaml \
#     --out data/interim/benchmark_matrix_eu27_v4.parquet
#
# Nothing in this file may change once a run has been scored.

panel:
  path: data/final/stage1_panel.parquet

target:
  event_column: event
  age_column: t_stop
  spell_column: spell_id
  formulation: landmark_remaining_lifetime
  horizons_years: [1, 3, 5]
  ibs_grid_years: [1, 2, 3]
  ibs_grid_years_extended: [1, 2, 3, 4, 5]
  max_horizon_years: 8
  # panel GAP_TOLERANCE (scripts/build_spells.py); see rolling_origin.py
  gap_tolerance: 1

window:
  # B0: prediction origins VN x EU27 x 2012-2024. History back to 2002 stays in
  # the source panel so experience/age counters are right for a 2012 origin.
  first_origin_year: 2012
  last_origin_year: 2024
  outcome_observed_through: 2025
  prospective_years: [2025]

exclusions:
  drop_gap_filled_rows: true

sampling:
  # Largest effective training block is ~105k origins (supplementary fold,
  # origins 2012-2021); 150k never binds. Trees keep their own 8k cap
  # (models/rsf.py, models/boosted_cox.py). Valid/test caps do not bind either.
  train_max_rows: 150000
  valid_max_rows: 25000
  test_max_rows: 30000
  seed: 20260910

tuning:
  n_trials:
    cheap: 3
    tree: 2
    deep: 2
  seeds: [1]
  deep_max_epochs: 20
  deep_patience: 3
  deep_batch_size: 1024

evaluation:
  primary_metric: ibs_1_3
  valid_metric: brier_1y
  bootstrap:
    n_boot: 200
    unit: spell
    seed: 4242
