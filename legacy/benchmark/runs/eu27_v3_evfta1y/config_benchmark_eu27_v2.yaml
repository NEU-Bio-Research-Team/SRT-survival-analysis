# Frozen benchmark configuration - EU27/B0-locked scope, second revision (eu27_v2).
#
# Supersedes benchmark_eu27.yaml (run eu27_v1), which stays frozen as scored.
# What changed, and why:
#   * panel filter  - GBR removed from the main sample in every year
#                     (B0: "UK tach rieng ... Khong gop vao mau chinh");
#                     see benchmark/features/eu27_scope.py.
#   * matrix        - data/interim/benchmark_matrix_eu27_v2.parquet.
#   * registry      - feature_registry_eu27_v2.yaml: calendar-time counters
#                     removed (exp_dest, years_since_fta, years_since_evfta_policy).
#   * metrics       - benchmark/evaluation now reads a row censored at c as
#                     "survived c years", as rolling_origin.censor_block writes
#                     it; eu27_v1 (and v1) were scored with a convention under
#                     which every one-year block - each validation block, which
#                     drives tuning - rewarded pessimistic predictions.
#   * sampling      - train cap raised so it never binds: the EU27 universe is
#                     small enough that capping at 40k made folds 2-4 identical
#                     in size and the "expanding window" nominal only.
#   * splits        - splits_eu27_v2.yaml (leaderboard, 3 folds with IBS 1-3
#                     observable in every fold) and splits_eu27_v2_evfta1y.yaml
#                     (supplementary, one-year-only fold whose training block
#                     reaches past EVFTA's entry into force).
#
# Build the matrix with:
#   python benchmark/features/build_matrix.py --eu27-only \
#     --config benchmark/config/benchmark_eu27_v2.yaml \
#     --registry benchmark/features/feature_registry_eu27_v2.yaml \
#     --out data/interim/benchmark_matrix_eu27_v2.parquet
#
# Nothing in this file may change once a run has been scored.

panel:
  path: data/final/stage1_panel.parquet

target:
  event_column: event
  age_column: t_stop
  spell_column: spell_id
  formulation: landmark_remaining_lifetime
  horizons_years: [1, 3, 5]
  ibs_grid_years: [1, 2, 3]
  ibs_grid_years_extended: [1, 2, 3, 4, 5]
  max_horizon_years: 8

window:
  # B0: prediction origins VN x EU27 x 2012-2024. History back to 2002 stays in
  # the source panel so experience/age counters are right for a 2012 origin.
  first_origin_year: 2012
  last_origin_year: 2024
  outcome_observed_through: 2025
  prospective_years: [2025]

exclusions:
  drop_gap_filled_rows: true

sampling:
  # Largest effective training block is ~105k origins (supplementary fold,
  # origins 2012-2021); 150k never binds. Trees keep their own 8k cap
  # (models/rsf.py, models/boosted_cox.py). Valid/test caps do not bind either.
  train_max_rows: 150000
  valid_max_rows: 25000
  test_max_rows: 30000
  seed: 20260910

tuning:
  n_trials:
    cheap: 3
    tree: 2
    deep: 2
  seeds: [1]
  deep_max_epochs: 20
  deep_patience: 3
  deep_batch_size: 1024

evaluation:
  primary_metric: ibs_1_3
  valid_metric: brier_1y
  bootstrap:
    n_boot: 200
    unit: spell
    seed: 4242
