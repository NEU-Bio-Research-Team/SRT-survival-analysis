# Rolling-origin temporal validation - EU27/B0 scope, leaderboard folds (eu27_v2).
#
# Same censoring rule as splits.yaml: each block is censored at the end of its
# own window, so the last year of a train/valid block has zero follow-up and
# drops out - effective origins are one year shorter than written (fold 1 trains
# on 2012-2014 and validates on 2016).
#
# Three folds, not four. With outcomes observed through 2025, a test block needs
# origins no later than 2022 for the 3-year horizon to be observable at all.
# eu27_v1's fourth fold (test 2024) had one year of follow-up, so its IBS 1-3
# was not a score; it moves to splits_eu27_v2_evfta1y.yaml and is read on
# one-year metrics only.

folds:
  - id: 1
    train: [2012, 2015]
    valid: [2016, 2017]
    test:  [2018, 2019]   # pre-EVFTA
  - id: 2
    train: [2012, 2017]
    valid: [2018, 2019]
    test:  [2020, 2021]   # COVID; EVFTA enters force 1 Aug 2020
  - id: 3
    train: [2012, 2019]
    valid: [2020, 2021]
    test:  [2022, 2023]   # post-EVFTA
