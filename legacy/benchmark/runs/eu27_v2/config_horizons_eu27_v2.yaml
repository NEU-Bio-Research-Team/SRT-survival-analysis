# Evaluation horizons, in years after the prediction origin (eu27_v2).
#
# u = 1 is the one-year failure question; u = 3 and u = 5 are the medium-run
# horizons Stage 2 needs for Value x S.
#
# IBS is integrated with the trapezoid rule on the IPCW Brier curve. It is NaN
# in any block where a horizon on its grid is unobservable (no row known alive
# at u) - that is why the leaderboard folds stop at test 2022-2023.

grid: [1, 2, 3, 4, 5, 6, 7, 8]
ibs_integrate_over: [1, 2, 3]                 # primary, observable in all leaderboard folds
ibs_integrate_over_extended: [1, 2, 3, 4, 5]  # folds 1-2 only (fold 3 test has <= 3 years of follow-up)
calibration_at: [1, 3, 5]
auc_at: [1, 3, 5]
calibration_bins: 10
