# Frozen benchmark configuration (Phase 0 deliverable).
# Nothing in this file may change once a run has been scored: every number in
# benchmark/reports/ is only interpretable against one frozen task definition.

panel:
  path: data/final/stage1_panel.parquet
  # 949,537 episode-years x 205 columns, 194,461 spells, 2002-2025.
  # Unit of a row: (importer j, product family p, year t). t_stop is the spell
  # age in years at the end of that row; t_stop - t_start == 1 everywhere.

target:
  # The panel's convention: event = 1 in year Y means the relationship is last
  # alive in Y and dies in Y+1. Every timing rule below follows from that.
  event_column: event
  age_column: t_stop
  spell_column: spell_id
  # Prediction origin = the row-year t. The information set F_t is everything
  # dated t or earlier. The target is remaining lifetime measured in years from
  # the origin:
  #     duration_u = (last year the spell is observed alive) - t + 1
  # so duration_u = 1 means "fails during the year after the origin", which is
  # exactly event = 1 on the origin row.
  formulation: landmark_remaining_lifetime
  horizons_years: [1, 3, 5]
  # The PRIMARY integration grid is 1-3, not 1-5, and the reason is a property of
  # the data rather than a preference. The last test block is 2022-2023 and the
  # data end in 2025, so a 2022 origin has three years of follow-up and a 2023
  # origin has two. An IBS integrated to five years would be undefined in fold 4
  # and therefore not comparable across folds. 1-5 is still reported for folds
  # 1-3, where it is genuinely observed.
  ibs_grid_years: [1, 2, 3]
  ibs_grid_years_extended: [1, 2, 3, 4, 5]
  max_horizon_years: 8

window:
  # 2002 is dropped: it is the first year of the data window, so every lagged
  # covariate is missing and every spell alive in it is left-truncated.
  # 2025 is dropped from the leaderboard: it carries zero events by construction
  # (a death in 2026 is not observable), so it is pure administrative censoring.
  # 2024 is dropped from the leaderboard because no importer's tariff is measured
  # in its own year after 2023 (contemporaneous share falls from 0.96 to 0.00).
  first_origin_year: 2003
  last_origin_year: 2023
  # Outcomes are read forward past the last origin year, up to:
  outcome_observed_through: 2025
  prospective_years: [2024, 2025]   # Phase 5 scenario scoring only

exclusions:
  # Rows that are not prediction origins.
  drop_gap_filled_rows: true   # sub-threshold padding years, not live episodes

sampling:
  # A fairness device, not a modelling choice: every model in a cell sees the
  # SAME sampled rows. Sampling is done at spell level so that the within-spell
  # dependence structure survives it.
  #
  # These caps are set by the hardware, not by statistics. The benchmark runs on
  # one laptop (6 GB GPU, shared CPU) and the full grid is 264 cells; at the
  # panel's full 779k origins a single tree cell alone would run for hours. The
  # caps are recorded here rather than buried because they bound what the results
  # can claim: this is a V1 comparison on a spell-level sample, and a model whose
  # advantage only appears at 500k rows would not show it here. Every model in a
  # cell is capped identically, so the COMPARISON is unaffected even though the
  # absolute level of every metric is.
  train_max_rows: 40000
  valid_max_rows: 25000
  test_max_rows: 30000
  seed: 20260910

tuning:
  # The plan asks for 30-50 trials per model per fold. That is not affordable on
  # this machine; the budget below is the honest substitute and is applied
  # identically inside each model family. Reported as a deviation.
  n_trials:
    cheap: 3      # coxnet, cloglog
    tree: 2       # rsf, boosted_cox
    deep: 2       # deepsurv, coxtime, deephit, cbnn
  seeds: [1]
  deep_max_epochs: 20
  deep_patience: 3
  deep_batch_size: 1024
  # Deviation, stated plainly: the plan asks for 30-50 trials per model per fold
  # and repeated seeds for the neural models. Neither is affordable here. The
  # budget is equal ACROSS models, which protects the contrast the benchmark is
  # built on (plan section 23.8 - no family is tuned harder than another), but it
  # is small in absolute terms, so no cell should be read as that model's
  # ceiling. Raising `n_trials` and `seeds` is the first thing to do on real
  # hardware and requires no code change.

evaluation:
  primary_metric: ibs_1_3
  # Tuning selects on the one-year IPCW Brier score. That is not a preference
  # either: a validation block may only read filings up to its own last year, so
  # every validation origin has exactly one year of observed follow-up and no
  # longer horizon is estimable without leaking the future into model selection.
  valid_metric: brier_1y
  bootstrap:
    n_boot: 200
    unit: spell        # block bootstrap over spells, never over rows
    seed: 4242
