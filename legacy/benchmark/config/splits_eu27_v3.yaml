# Rolling-origin temporal validation - EU27/B0 scope, eu27_v3 (panel v2).
#
# Censoring follows the panel's gap rule (benchmark_eu27_v3.yaml,
# target.gap_tolerance = 1): inside a block read to year H a death is an event
# only if the relationship was last alive in D <= H - 2. Three consequences
# fix the shape of these folds:
#   * test blocks are read to 2025, so deaths are confirmable through 2023 and
#     IBS 1-3 is observable only for test origins up to 2021;
#   * a validation block [lo, hi] holds events only for origins <= hi - 2, so
#     it needs three years to score a one-year Brier at all;
#   * a training block [lo, hi] carries events for origins <= hi - 2; origin
#     hi - 1 enters censored only, origin hi not at all.
# Test blocks are single years, disjoint, on either side of EVFTA's entry into
# force (1 Aug 2020). The v2 supplementary EVFTA-1y fold is not carried over:
# a model trained on post-EVFTA origins with confirmed events needs a training
# horizon of 2023, which leaves no validation block with an event after it.

folds:
  - id: 1
    train: [2012, 2015]
    valid: [2016, 2018]
    test:  [2019, 2019]   # pre-EVFTA
  - id: 2
    train: [2012, 2016]
    valid: [2017, 2019]
    test:  [2020, 2020]   # COVID; EVFTA enters force 1 Aug 2020
  - id: 3
    train: [2012, 2017]
    valid: [2018, 2020]
    test:  [2021, 2021]   # first full EVFTA year
